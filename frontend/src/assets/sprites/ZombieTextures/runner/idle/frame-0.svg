<svg width="64" height="108" viewBox="0 0 64 108" xmlns="http://www.w3.org/2000/svg">
  <!-- Runner, frame 0 of 4. Same silhouette language as the shambler but read
       as faster: leaning forward, longer stride, thinner limbs, and a red
       shirt so the dangerous-fast one is distinguishable from the ordinary one
       at a glance in a crowded lane. -->
  <g stroke="#22301c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Far leg, driving back -->
    <path d="M38 70 L47 84 L52 97" fill="none" stroke="#3f5230" stroke-width="7" />
    <!-- Far arm, pumped back -->
    <path d="M40 44 L50 53" fill="none" stroke="#5c7a3e" stroke-width="6" />

    <!-- Torso, leaning into the run -->
    <path d="M22 33 L45 36 L44 71 L19 70 Z" fill="#7a3b3b" />
    <path d="M19 62 L28 66 L35 60 L42 66 L44 62 L44 71 L19 70 Z" fill="#5e2c2c" />

    <!-- Near leg, stretched far forward -->
    <path d="M26 70 L16 84 L9 96" fill="none" stroke="#5c7a3e" stroke-width="7" />
    <!-- Near arm, thrown forward -->
    <path d="M25 44 L12 45 L4 40" fill="none" stroke="#6b8c4a" stroke-width="6" />

    <!-- Head, thrust ahead of the shoulders -->
    <circle cx="26" cy="20" r="11.5" fill="#6b8c4a" />
    <circle cx="19" cy="18" r="2.5" fill="#22301c" stroke="none" />
    <path d="M17 27 L27 28" fill="none" stroke="#22301c" stroke-width="2" />
  </g>
</svg>
